# Builds an installable Android APK on every push to main (or on demand from the Actions tab)
# and publishes it as a GitHub Release, so it can be downloaded straight to a phone.
#
# One-time setup (see README, "Get the game on your Android phone"):
#   Settings > Secrets and variables > Actions > add UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Game logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Tools/CoreTests/CoreTests.csproj

  android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing Unity license secrets. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD under Settings > Secrets and variables > Actions (see README)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The Unity Android image is large; make room on the runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildName: JellyDrop
          buildMethod: JellyDrop.EditorTools.CiBuild.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Locate APK
        run: |
          APK=$(find build -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK was produced"; exit 1; fi
          cp "$APK" JellyDrop.apk
          echo "Built $(du -h JellyDrop.apk | cut -f1) APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyDrop-apk
          path: JellyDrop.apk

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jelly Drop test build ${{ github.run_number }}
          prerelease: true
          files: JellyDrop.apk
          body: |
            Test build from commit ${{ github.sha }}.
            Download **JellyDrop.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
            Signed with Unity's debug key: for testing only, not for the Play Store.
