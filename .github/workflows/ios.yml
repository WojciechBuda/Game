# Builds an UNSIGNED iOS test app (.ipa) on demand: Actions tab > "iOS test build" > Run workflow.
# 1. Unity (Linux runner) writes the Xcode project.
# 2. A macOS runner compiles it without code signing and packs Stackville-unsigned.ipa.
# Install it on an iPhone from Windows with Sideloadly and a free Apple ID (see Store/IOS.md).
# Needs the same Unity licence secrets as the Android build: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
name: iOS test build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xcode-project:
    name: Unity -> Xcode project
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check Unity license secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing Unity license secrets. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD under Settings > Secrets and variables > Actions (see Store/IOS.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Build Xcode project with Unity
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          buildName: Stackville
          buildMethod: JellyDrop.EditorTools.CiBuild.BuildIos
          allowDirtyBuild: true

      - name: Pack Xcode project
        run: |
          DIR=$(dirname "$(find build -name 'Unity-iPhone.xcodeproj' -maxdepth 4 | head -n 1)")
          if [ -z "$DIR" ] || [ "$DIR" = "." ]; then echo "::error::No Xcode project was produced"; exit 1; fi
          tar -czf xcode.tgz -C "$DIR" .

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode.tgz
          retention-days: 2

  ipa:
    name: Xcode -> unsigned .ipa
    needs: xcode-project
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Unpack
        run: mkdir xcode && tar -xzf xcode.tgz -C xcode

      - name: CocoaPods (only if the project has a Podfile)
        working-directory: xcode
        run: if [ -f Podfile ]; then pod install --repo-update; fi

      - name: Compile without signing
        working-directory: xcode
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then SRC="-workspace Unity-iPhone.xcworkspace"; else SRC="-project Unity-iPhone.xcodeproj"; fi
          xcodebuild $SRC -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40

      - name: Make .ipa
        run: |
          APP=$(find xcode/dd/Build/Products -name '*.app' -maxdepth 3 | head -n 1)
          if [ -z "$APP" ]; then echo "::error::No .app was produced"; exit 1; fi
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry Stackville-unsigned.ipa Payload
          echo "Built $(du -h Stackville-unsigned.ipa | cut -f1) ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Stackville-ios
          path: Stackville-unsigned.ipa

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Stackville iOS test build ${{ github.run_number }}
          prerelease: true
          files: Stackville-unsigned.ipa
          body: |
            Unsigned iOS test build from commit ${{ github.sha }}.
            Install with Sideloadly on Windows and a free Apple ID (see Store/IOS.md). The app stops opening
            after 7 days with a free Apple ID; install it again to refresh. Ads and purchases are test versions.
